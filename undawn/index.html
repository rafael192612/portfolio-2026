<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Planejador de materiais e rotas de coleta de Undawn."><title>Undawn Craft Tree</title><link rel="stylesheet" href="./styles.css"></head><body><header><a href="../" aria-label="Voltar ao portfólio">← Portfólio</a><span>UNDawn <b>Craft Tree</b></span></header><main><section class="hero" id="profile"><div class="avatar">U</div><div><p>PERFIL DO SOBREVIVENTE</p><h1 id="name">Não informado</h1><span id="server">Servidor não informado</span></div><div class="actions"><button id="edit">Editar perfil</button><button id="backup">Exportar</button><label>Importar<input id="restore" type="file" accept="application/json" hidden></label></div><dl id="stats"></dl></section><section class="craft"><div class="heading"><div><p>CRAFT</p><h2>Árvore de materiais</h2></div><span id="state"></span></div><div class="selectors"><label>Arma<select id="weapon"></select></label><label>Nível<select id="level"></select></label></div><p class="warning" id="warning"></p><div id="tree" class="tree" aria-live="polite"></div><section class="totals"><h3>Matérias-primas totais</h3><ul id="totals"></ul></section></section></main><dialog id="profileDialog"><form method="dialog" id="form"><h2>Editar perfil</h2><label>Nome<input name="name" placeholder="Adicionar valor"></label><label>Servidor<input name="server" placeholder="Adicionar valor"></label><div id="profileFields"></div><menu><button value="cancel">Cancelar</button><button value="save">Salvar</button></menu></form></dialog><dialog id="details"><button id="close" aria-label="Fechar">×</button><div id="detail"></div></dialog><script type="module" src="./js/app.js"></script></body></html>
